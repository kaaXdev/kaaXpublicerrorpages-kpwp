<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            position: relative;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 80px;
            margin: 0;
            color: #2d3748;
        }

        h2 {
            margin: 10px 0;
            font-weight: normal;
            color: #4a5568;
        }

        p {
            color: #718096;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: white;
            background: #4f46e5;
            padding: 10px 20px;
            border-radius: 6px;
            transition: 0.2s;
        }

        a:hover {
            background: #4338ca;
        }

        .credit {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you’re looking for doesn’t exist… it probably wandered off ☕</p>
        <a href="/">Go back home</a>
    </div>

    <div class="credit">
        © kaaXdev
    </div>
</body>
</html>
